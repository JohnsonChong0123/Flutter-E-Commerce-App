  release_build:
    name: Release Build
    needs: patrol_android
    # [patrol_android, patrol_ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Decode and Setup Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties
      
      - name: Inject Facebook Secrets
        run: |
          sed -i '/FACEBOOK_APP_ID/d' android/gradle.properties
          sed -i '/FACEBOOK_CLIENT_TOKEN/d' android/gradle.properties
          echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> android/gradle.properties
          echo "FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN }}" >> android/gradle.properties
      
      - name: Inject Google Maps API Key
        run: |
          sed -i '/GOOGLE_MAPS_API_KEY/d' android/gradle.properties
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> android/gradle.properties
      
      - name: Create .env file
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
      
      - name: Install Dependencies
        run: flutter pub get
      
      - name: Build Release APK
        run: flutter build apk --release -v
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-app
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
  
  build_ios_simulator:
    name: Build iOS Simulator Zip
    needs: release_build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Inject Facebook config (iOS)
        env:
          FB_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FB_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: |
          set -euo pipefail
          PLIST=ios/Runner/Info.plist
          PB=/usr/libexec/PlistBuddy

          [ -n "$FB_APP_ID" ] || { echo "FACEBOOK_APP_ID is empty"; exit 1; }
          [ -n "$FB_CLIENT_TOKEN" ] || { echo "FACEBOOK_CLIENT_TOKEN is empty"; exit 1; }

          set_str() {
            $PB -c "Set :$1 $2" "$PLIST" 2>/dev/null || $PB -c "Add :$1 string $2" "$PLIST"
          }
          set_str FacebookAppID "$FB_APP_ID"
          set_str FacebookClientToken "$FB_CLIENT_TOKEN"

          if ! $PB -c "Print :CFBundleURLTypes" "$PLIST" 2>/dev/null | grep -q "fb$FB_APP_ID"; then
            $PB -c "Print :CFBundleURLTypes" "$PLIST" >/dev/null 2>&1 || $PB -c "Add :CFBundleURLTypes array" "$PLIST"
            N=$($PB -c "Print :CFBundleURLTypes" "$PLIST" | grep -c "Dict {" || true)
            $PB -c "Add :CFBundleURLTypes:$N dict" "$PLIST"
            $PB -c "Add :CFBundleURLTypes:$N:CFBundleURLSchemes array" "$PLIST"
            $PB -c "Add :CFBundleURLTypes:$N:CFBundleURLSchemes:0 string fb$FB_APP_ID" "$PLIST"
          fi

          $PB -c "Print :LSApplicationQueriesSchemes" "$PLIST" >/dev/null 2>&1 || $PB -c "Add :LSApplicationQueriesSchemes array" "$PLIST"
          for s in fbapi fb-messenger-share-api; do
            $PB -c "Print :LSApplicationQueriesSchemes" "$PLIST" | grep -q "$s" || $PB -c "Add :LSApplicationQueriesSchemes: string $s" "$PLIST"
          done

          for k in FacebookAppID FacebookClientToken; do
            $PB -c "Print :$k" "$PLIST" >/dev/null && echo "$k OK"
          done

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build iOS Simulator App
        run: flutter build ios --simulator --debug --no-codesign

      - name: Package into Zip
        run: |
          cd build/ios/iphonesimulator
          zip -r Runner.app.zip Runner.app
          echo "Created Zip file:"
          ls -lh Runner.app.zip

      - name: Upload Simulator Zip
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build/ios/iphonesimulator/Runner.app.zip
          retention-days: 7