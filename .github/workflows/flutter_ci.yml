name: Flutter CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  unit_test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-test-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Create .env file for tests
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Install Dependencies
        run: flutter pub get
      
      - name: Run Tests
        run: flutter test

  android_test:
    name: Android Tests
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Create .env file for tests
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Android JVM Unit Tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
  
  patrol_tests:
    name: Patrol E2E Tests (Android & iOS)
    needs: android_test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-patrol-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Setup Android Emulator
        run: |
          echo "y" | sdkmanager "system-images;android-33;google_apis;x86_64"
          echo "y" | sdkmanager "platforms;android-33"
          echo "y" | sdkmanager "platform-tools"
          echo "y" | sdkmanager "emulator"
          
          echo "no" | avdmanager create avd -n patrol_avd -k "system-images;android-33;google_apis;x86_64" --device "pixel_5"
          
          emulator -avd patrol_avd -no-audio -no-window -gpu swiftshader_indirect -verbose &
          
          echo "Waiting for emulator to start..."
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed | tr -d '\r') ]]; do sleep 1; done;'
          sleep 10

          adb devices
      
      - name: Setup iOS Simulator
        run: |
          xcrun simctl create "Patrol iPhone" "iPhone 15 Pro"
          xcrun simctl boot "Patrol iPhone"
          xcrun simctl list devices
      
      - name: Create .env file
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env
      
      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
      
      - name: Install Dependencies
        run: flutter pub get
      
      - name: Run Patrol Android Tests
        run: |
          flutter pub global activate patrol
          flutter pub global run patrol test \
            --device android \
            --target patrol_test
      
      - name: Run Patrol iOS Tests
        run: |
          flutter pub global run patrol test \
            --device ios \
            --target patrol_test
      
      - name: Upload Patrol Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-test-results
          path: |
            patrol_output/
            build/app/outputs/androidTest/
          retention-days: 7
      
      - name: Cleanup Emulator
        if: always()
        run: |
          adb emu kill || true
  
  release_build:
    name: Release Build
    needs: patrol_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Decode and Setup Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties
      
      - name: Inject Facebook Secrets
        run: |
          sed -i '/FACEBOOK_APP_ID/d' android/gradle.properties
          sed -i '/FACEBOOK_CLIENT_TOKEN/d' android/gradle.properties
          echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> android/gradle.properties
          echo "FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN }}" >> android/gradle.properties
      
      - name: Inject Google Maps API Key
        run: |
          sed -i '/GOOGLE_MAPS_API_KEY/d' android/gradle.properties
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> android/gradle.properties
      
      - name: Create .env file
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
      
      - name: Install Dependencies
        run: flutter pub get
      
      - name: Build Release APK
        run: flutter build apk --release -v
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-app
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7