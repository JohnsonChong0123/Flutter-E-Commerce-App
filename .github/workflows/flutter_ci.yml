name: Flutter CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  unit_test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-test-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Create .env file for tests
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Install Dependencies
        run: flutter pub get
      
      - name: Run Tests
        run: flutter test

  android_test:
    name: Android Tests
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Create .env file for tests
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Android JVM Unit Tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
  
  patrol_android:
    name: Patrol Android E2E
    needs: android_test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-patrol-android-${{ hashFiles('**/pubspec.lock') }}

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - name: Setup Android Emulator and Run Patrol Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          timeout: 600
          enable-kvm: false
          disable-animations: true

          script: |
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
            echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

            flutter pub get

            adb devices

            patrol test --device android

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-android-results
          path: patrol_output/
          retention-days: 7

  patrol_ios:
    name: Patrol iOS E2E
    needs: android_test
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-patrol-ios-${{ hashFiles('**/pubspec.lock') }}

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli

      - name: Create .env file
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      - name: Show Available iOS Simulators
        run: |
          xcrun simctl list devices available

      - name: Run Patrol iOS Tests
        run: |
          patrol test --device ios

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-ios-results
          path: patrol_output/
          retention-days: 7
  
  release_build:
    name: Release Build
    needs: [patrol_android, patrol_ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Decode and Setup Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties
      
      - name: Inject Facebook Secrets
        run: |
          sed -i '/FACEBOOK_APP_ID/d' android/gradle.properties
          sed -i '/FACEBOOK_CLIENT_TOKEN/d' android/gradle.properties
          echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> android/gradle.properties
          echo "FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN }}" >> android/gradle.properties
      
      - name: Inject Google Maps API Key
        run: |
          sed -i '/GOOGLE_MAPS_API_KEY/d' android/gradle.properties
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> android/gradle.properties
      
      - name: Create .env file
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
      
      - name: Install Dependencies
        run: flutter pub get
      
      - name: Build Release APK
        run: flutter build apk --release -v
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-app
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7