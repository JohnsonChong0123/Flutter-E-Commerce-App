name: Flutter CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  unit_test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-test-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Create .env file for tests
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Install Dependencies
        run: flutter pub get
      
      - name: Run Tests
        run: flutter test

  android_test:
    name: Android Tests
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Create .env file for tests
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Android JVM Unit Tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
  
  patrol_android:
    name: Patrol Android E2E
    needs: android_test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - device_model: "shiba"
            api_level: "35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable

      - name: Precache Android
        run: flutter precache --android

      - name: Create .env
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" \
            | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.7.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}

      - name: Build Patrol Android
        run: |
          patrol build android --emit-test-manifest

      - name: Run Patrol on Firebase Test Lab
        run: |
          gcloud firebase test android run \
            --type instrumentation \
            --use-orchestrator \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=${{ matrix.device_model }},version=${{ matrix.api_level }},locale=en,orientation=portrait \
            --timeout 15m \
            --record-video \
            --environment-variables clearPackageData=true \
            --directories-to-pull=/sdcard/Download/screenshots \
            --results-bucket=e-commerce-test-lab-results

      - name: Upload Patrol Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-android-api-${{ matrix.api_level }}
          path: |
            patrol_output/
            build/test-results/
          retention-days: 7

  patrol_ios:
    name: Patrol iOS E2E - Firebase Test Lab
    needs: android_test
    runs-on: macos-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - device_model: "YOUR_IOS_DEVICE_MODEL"
            ios_version: "YOUR_IOS_VERSION"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable

      - name: Precache iOS
        run: flutter precache --ios

      - name: Create .env
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create GoogleService-Info.plist
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" \
            | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        working-directory: ios
        run: |
          pod install --repo-update

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.7.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY_JSON }}'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}

      - name: Build Patrol iOS
        run: |
          patrol build ios \
            --target patrol_test \
            --release

      - name: Find Patrol iOS Build Files
        run: |
          echo "=== Build Products ==="
          find build/ios_integ/Build/Products -maxdepth 2 -type f -o -type d

      - name: Package iOS XCTest
        run: |
          cd build/ios_integ/Build/Products

          XCTESTRUN=$(find . -maxdepth 1 -name "*.xctestrun" | head -1)

          echo "Using XCTestRun: $XCTESTRUN"

          zip -r ios_tests.zip \
            Release-iphoneos \
            "$XCTESTRUN"

      - name: Show Firebase iOS Devices
        run: |
          gcloud firebase test ios models list

      - name: Run Patrol on Firebase Test Lab
        run: |
          gcloud firebase test ios run \
            --test build/ios_integ/Build/Products/ios_tests.zip \
            --device model=${{ matrix.device_model }},version=${{ matrix.ios_version }},locale=en_US,orientation=portrait \
            --timeout 15m \
            --results-bucket=e-commerce-test-lab-results

      - name: Upload Patrol iOS Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-ios-firebase-${{ matrix.ios_version }}
          path: |
            build/ios_integ/Build/Products/ios_tests.zip
            patrol_output/
          retention-days: 7
  
  release_build:
    name: Release Build
    needs: [patrol_android, patrol_ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Decode and Setup Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties
      
      - name: Inject Facebook Secrets
        run: |
          sed -i '/FACEBOOK_APP_ID/d' android/gradle.properties
          sed -i '/FACEBOOK_CLIENT_TOKEN/d' android/gradle.properties
          echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> android/gradle.properties
          echo "FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN }}" >> android/gradle.properties
      
      - name: Inject Google Maps API Key
        run: |
          sed -i '/GOOGLE_MAPS_API_KEY/d' android/gradle.properties
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> android/gradle.properties
      
      - name: Create .env file
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
      
      - name: Install Dependencies
        run: flutter pub get
      
      - name: Build Release APK
        run: flutter build apk --release -v
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-app
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7