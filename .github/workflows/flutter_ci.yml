name: Flutter CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  unit_test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-flutter-test-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Create .env file for tests
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Install Dependencies
        run: flutter pub get
      
      - name: Run Tests
        run: flutter test

  android_test:
    name: Android Tests
    needs: unit_test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9

      - name: Create .env file for tests
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Android JVM Unit Tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
  
  patrol_android:
    name: Patrol Android E2E
    needs: android_test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        api-level:
          - 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable

      - name: Precache Android
        run: flutter precache --android

      - name: Create .env
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" \
            | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - name: Build Patrol Android
        run: |
          patrol build android --verbose

      - name: Install ew-cli
        run: |
          mkdir -p "$HOME/bin"
          curl "https://maven.emulator.wtf/releases/ew-cli" \
            -o "$HOME/bin/ew-cli"
          chmod +x "$HOME/bin/ew-cli"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Run Patrol on emulator.wtf
        env:
          EW_API_TOKEN: ${{ secrets.EW_API_TOKEN }}
        run: |
          ew-cli \
            --app build/app/outputs/apk/debug/app-debug.apk \
            --test build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --device model=Pixel7,version=${{ matrix.api-level }}

      - name: Upload Patrol Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-android-api-${{ matrix.api-level }}
          path: |
            patrol_output/
            build/test-results/
          retention-days: 7

  patrol_ios:
    name: Patrol iOS E2E
    needs: android_test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: '26.2'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable

      - name: Preload Flutter iOS artifacts
        run: flutter precache --ios

      - name: Install Patrol CLI
        run: dart pub global activate patrol_cli

      - name: Create .env
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Start iOS Simulator
        uses: futureware-tech/simulator-action@v2
        with:
          model: iPhone 17
          os: iOS
          os_version: 26.2
          erase_before_boot: true
          shutdown_after_job: true

      - name: Run Patrol iOS Tests
        run: |
          xcrun simctl spawn booted log stream \
            --type log \
            --color none > all_simulator_logs.txt &

          logpid="$!"

          sleep 10

          TESTS_EXIT_CODE=0

          patrol test \
            --verbose \
            --ios 26.2 \
            --full-isolation \
            --record-video \
            --video-output-dir patrol_videos \
            || TESTS_EXIT_CODE=$?

          kill -SIGINT "$logpid" 2>/dev/null || true

          sleep 1

          kill -9 "$logpid" 2>/dev/null || true

          exit $TESTS_EXIT_CODE

      - name: Upload Patrol Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-ios-results
          path: |
            patrol_output/
            patrol_videos/
            all_simulator_logs.txt
          retention-days: 7
  
  release_build:
    name: Release Build
    needs: [patrol_android, patrol_ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
          key: ${{ runner.os }}-flutter-build-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Decode and Setup Keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=release.keystore" >> android/key.properties
      
      - name: Inject Facebook Secrets
        run: |
          sed -i '/FACEBOOK_APP_ID/d' android/gradle.properties
          sed -i '/FACEBOOK_CLIENT_TOKEN/d' android/gradle.properties
          echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> android/gradle.properties
          echo "FACEBOOK_CLIENT_TOKEN=${{ secrets.FACEBOOK_CLIENT_TOKEN }}" >> android/gradle.properties
      
      - name: Inject Google Maps API Key
        run: |
          sed -i '/GOOGLE_MAPS_API_KEY/d' android/gradle.properties
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> android/gradle.properties
      
      - name: Create .env file
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" > .env
          echo "SERVER_URL=${{ secrets.SERVER_URL }}" >> .env

      - name: Create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
      
      - name: Install Dependencies
        run: flutter pub get
      
      - name: Build Release APK
        run: flutter build apk --release -v
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-app
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7